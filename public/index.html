<body>
  <div class="js-mobile-drawer" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:40;"

      <button class="icon-btn js-menu-toggle" style="margin-bottom:var(--space-md);" aria-label="Cerrar menú">

      </button>
      <nav style="display:flex; flex-direction:column; gap:var(--space-md);">
        <a href="#" class="text-label-lg c-primary">Explorar</a>
        <a href="#" class="text-label-lg c-secondary">Lecturas</a>
        <a href="#" class="text-label-lg c-secondary">Favoritos</a>

  <main>
    <div class="feed-container">
      <div style="margin-bottom:var(--space-lg);">
        <h1 class="text-display" style="margin-bottom:var(--space-sm);">Devenir</h1>
        <p class="feed-tagline">"El pensamiento es un hilo, la lectura es el tejido."</p>
      </div>

      <div class="chip-row" role="tablist" aria-label="Filtrar por categoría">
        <button class="chip is-active" role="tab" aria-selected="true">Artículos</button>
        <button class="chip" role="tab" aria-selected="false">¿Qué clase social eres?</button>
        <button class="chip js-buzos-chip" role="tab" aria-selected="false">Buzos de la noticia</button>
        <button class="chip" role="tab" aria-selected="false">Más proximamente...</button>
      </div>

      <div id="feed-skeleton"
        style="display:none; grid-template-columns:1fr 1fr; gap:var(--space-md); margin-bottom:var(--space-xl);">
        <div class="skeleton"
          style="height:220px; border-radius:var(--radius-lg); background:var(--surface-low); box-shadow:var(--neu-carved);">
        </div>
        <div class="skeleton"
          style="height:220px; border-radius:var(--radius-lg); background:var(--surface-low); box-shadow:var(--neu-carved);">
        </div>
        <div class="skeleton"
          style="height:220px; border-radius:var(--radius-lg); background:var(--surface-low); box-shadow:var(--neu-carved);">
        </div>
        <div class="skeleton"
          style="height:220px; border-radius:var(--radius-lg); background:var(--surface-low); box-shadow:var(--neu-carved);">
        </div>
      </div>

      <div id="featured-slot" style="margin-bottom:var(--space-xl);"></div>

      <div id="articles-grid" class="articles-grid"></div>

      <div class="load-more-wrapper" id="load-more-wrapper">
        <button class="load-more-btn neu-btn js-load-more" aria-label="Cargar más artículos">
          Cargar más pensamientos
          <span class="icon">keyboard_arrow_down</span>
        </button>
      </div>
      <div
        style="width:64px; height:1px; background:var(--outline-variant); margin:var(--space-md) auto 0; opacity:.3;">
      </div>
    </div>
  </main>

  <aside class="floating-sidebar"
    style="display:none; position:fixed; left:24px; top:50%; transform:translateY(-50%); flex-direction:column; gap:var(--space-md); z-index:40;">
    <button class="icon-btn neu-extruded" title="Inicio"><span class="icon">home</span></button>
    <button class="icon-btn neu-extruded" title="Artículo aleatorio"><span class="icon">shuffle</span></button>
    <button class="icon-btn neu-extruded" title="Mi lectura"><span class="icon">book_2</span></button>
    <button class="icon-btn neu-extruded js-theme-toggle" title="Cambiar tema"><span
        class="icon js-theme-icon">dark_mode</span></button>
  </aside>

  <nav class="mobile-nav" aria-label="Navegación principal móvil">
    <a href="#" class="is-active" aria-current="page"><span
        class="icon icon--sm icon--fill">home</span><span>Inicio</span></a>
    <a href="#"><span class="icon icon--sm">shuffle</span><span>Aleatorio</span></a>
    <a href="#"><span class="icon icon--sm">book_2</span><span>Lectura</span></a>
    <button class="mobile-theme-toggle js-theme-toggle" aria-label="Cambiar tema"><span
        class="icon icon--sm js-theme-icon">dark_mode</span><span>Tema</span></button>
  </nav>

  <footer class="site-footer">
    <div class="inner container">
      <div class="flex-gap-sm">
        <img
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuAI9CcxbM0UHFj3eWBM8xw__Dohu9Aa9sADmSuM-yiGp_5WOJlI3wHnIssAzM2UwWSWzz_s_vHb4eVOm76qDJhxBev84iXW_YRthY_jYftFk_iLMmhdr1fwcW3M5MzbR-SmlW4kShFZiQqOtGmO64c4r4w6i1Yy_5T1yp3pAoh84UpU5WaYMQUm7xIXg9L9IzQj9xEiDLTGhDPf2aYa5egblRG6UDvbQgo4V_nk1J9CnG1qL9wTa29RxiYMKQT0sp3d2_jJE1N9pQfy"
          alt="Devenir Blog" style="height:24px; width:auto; opacity:0.5;" />
        <span class="site-footer__copy">© 2023 Devenir Blog. Todos los derechos reservados.</span>
      </div>
      <div class="site-footer__links">
        <a href="#">Privacidad</a>
        <a href="#">Términos</a>
        <a href="#">Newsletter</a>
      </div>
    </div>
  </footer>

  <script src="./js/devenir.js"></script>
  <script src="./js/articles-loader.js"></script>
  <script>
    (function () {
      /* === CONFIGURACIÓN === */
      const API_PROXY = 'https://corsproxy.io/?';   // proxy CORS público
      const BUZOS_SEARCH_URL = 'https://buzos.com.mx/search-results?s=heras&filter=*.html';
      const STATIC_THUMB = 'https://lh3.googleusercontent.com/aida-public/AB6AXuCpgkdiQ7oBdGMPUgrOX5dNH-JlC1xcJbVe2SYUYM7y9nKsp8S77kIehmnSJAj1OGTgG35rb95PpE7oBpPyYB_TtIcwhpJU6VdJ95p2gzk7XwIYHlpEAD4qUo5MnXJ_7B4HhJ6ZU_cYubbS-oJSwc4K7cAYxpR9usM9lUEy4RB6FP-11IFsvqR4WHOsL_ORip4srjeTOE-Tb76cJLjxarTPQ0-8J9Kb_Fqt0qlzNl0MM7msXVNIqRYCNtd4JrLVX2heRa_xOqQTSiBs'; // imagen genérica

      const gridContainer = document.getElementById('articles-grid');
      const skeleton = document.getElementById('feed-skeleton');
      const loadMoreWrapper = document.getElementById('load-more-wrapper');
      const buzosChip = document.querySelector('.js-buzos-chip');
      const chips = document.querySelectorAll('.chip');

      /* === PARSEADOR DEL HTML DE BÚSQUEDA === */
      function parseBuzosHTML(htmlString) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, 'text/html');
        const items = doc.querySelectorAll('.search-list-item');
        const articles = [];

        items.forEach(item => {
          const titleEl = item.querySelector('h5 a.search-link');
          const descEl = item.querySelector('p:not(.match)');   // primer párrafo que no sea el del match
          const authorMatch = item.querySelector('.match em');

          if (!titleEl) return;

          let author = 'Buzos';
          if (authorMatch) {
            const text = authorMatch.textContent || '';
            const match = text.match(/Autor:\s*(.+)/);
            if (match) author = match[1].trim();
          }

          articles.push({
            title: titleEl.textContent.trim(),
            link: titleEl.href,
            excerpt: descEl ? descEl.textContent.trim() : '',
            author: author,
            category: 'Buzos',
            date: 'Fecha no disponible',
            readTime: '5 min'   // no hay info real
          });
        });

        return articles;
      }

      /* === CREACIÓN DE UNA CARD NEUMÓRFICA === */
      function createArticleCard(article) {
        const card = document.createElement('article');
        card.className = 'article-card fade-in';

        card.innerHTML = `
          <div class="flex-gap-sm" style="flex-wrap:wrap;">
            <span class="article-card__tag neu-carved">${article.category}</span>
            <span class="text-label-md c-muted">${article.readTime}</span>
          </div>
          <div class="article-card__header">
            <h3 class="article-card__title">${article.title}</h3>
            <button class="bookmark-btn" data-saved="false" aria-label="Guardar artículo">
              <span class="icon">bookmark</span>
            </button>
          </div>
          <p class="article-card__excerpt">${article.excerpt}</p>
          <div class="article-card__footer">
            <div class="flex-gap-sm">
              <div class="avatar" style="width:32px; height:32px; background:var(--secondary-container); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; color:var(--on-secondary-container);">${article.author.charAt(0)}</div>
              <span class="text-label-md" style="font-weight:600;">${article.author}</span>
            </div>
            <span class="text-label-md c-muted">${article.date}</span>
          </div>
        `;

        // Enlace completo en la tarjeta (opcional: abrir en ventana nueva)
        card.addEventListener('click', (e) => {
          if (e.target.closest('button')) return; // no interferir con bookmark
          window.open(article.link, '_blank');
        });
        card.style.cursor = 'pointer';

        return card;
      }

      /* === RENDERIZADO DEL FEED === */
      function renderArticles(articles) {
        gridContainer.innerHTML = '';
        if (articles.length === 0) {
          gridContainer.innerHTML = '<p class="text-body-md c-muted" style="grid-column:1/-1; text-align:center;">No se encontraron artículos.</p>';
          return;
        }
        articles.forEach(article => gridContainer.appendChild(createArticleCard(article)));
      }

      /* === MOSTRAR / OCULTAR SKELETON === */
      function toggleSkeleton(show) {
        skeleton.style.display = show ? 'grid' : 'none';
      }

      /* === CARGA DESDE API === */
      async function loadBuzosArticles() {
        toggleSkeleton(true);
        gridContainer.innerHTML = '';
        loadMoreWrapper.style.display = 'none';   // ocultar "Cargar más" porque la API no pagina

        try {
          const proxyUrl = API_PROXY + encodeURIComponent(BUZOS_SEARCH_URL);
          const response = await fetch(proxyUrl);
          if (!response.ok) throw new Error('Error de red');
          const html = await response.text();
          const articles = parseBuzosHTML(html);
          renderArticles(articles);
        } catch (error) {
          console.error(error);
          gridContainer.innerHTML = '<p class="text-body-md c-error" style="grid-column:1/-1; text-align:center;">No se pudieron cargar los artículos. Intenta de nuevo más tarde.</p>';
        } finally {
          toggleSkeleton(false);
        }
      }

      /* === CAMBIO DE CHIPS === */
      function activateChip(chip) {
        chips.forEach(c => {
          c.classList.remove('is-active');
          c.setAttribute('aria-selected', 'false');
        });
        chip.classList.add('is-active');
        chip.setAttribute('aria-selected', 'true');
      }

      buzosChip.addEventListener('click', () => {
        activateChip(buzosChip);
        loadBuzosArticles();
      });

      const defaultChip = document.querySelector('.chip.is-active');
      defaultChip.addEventListener('click', () => {
        activateChip(defaultChip);
        // Restaurar feed original sin recargar
        if (window.reloadFeed) {
          window.reloadFeed();
        } else {
          window.location.reload(); // fallback
        }
        loadMoreWrapper.style.display = '';
      });

      /* === RESPONSIVE SIDEBAR (ya lo tenías, lo mantenemos) === */
      const floatingSidebar = document.querySelector('.floating-sidebar');
      const mediaQuery = window.matchMedia('(min-width: 1024px)');
      function toggleSidebar(e) {
        floatingSidebar.style.display = e.matches ? 'flex' : 'none';
      }
      mediaQuery.addEventListener('change', toggleSidebar);
      toggleSidebar(mediaQuery);

      /* === THEME TOGGLE (ambos botones) === */
      const themeToggles = document.querySelectorAll('.js-theme-toggle');
      const themeIcons = document.querySelectorAll('.js-theme-icon');
      const html = document.documentElement;

      function setTheme(isDark) {
        html.classList.toggle('dark', isDark);
        html.setAttribute('data-theme', isDark ? 'dark' : 'light');
        const iconName = isDark ? 'light_mode' : 'dark_mode';
        themeIcons.forEach(icon => icon.textContent = iconName);
        localStorage.setItem('devenir-theme', isDark ? 'dark' : 'light');
      }

      const savedTheme = localStorage.getItem('devenir-theme');
      if (savedTheme) {
        setTheme(savedTheme === 'dark');
      }

      themeToggles.forEach(btn => {
        btn.addEventListener('click', () => {
          const isDark = !html.classList.contains('dark');
          setTheme(isDark);
        });
      });
    })();
  </script>
</body>

</html>
